# Publishes @reearth/cms-api (ts/) to npm.
# Must be triggered manually from the GitHub Actions UI (Actions tab →
# "Publish @reearth/cms-api" → Run workflow) on the main branch.
#
# Publishing uses npm OIDC Trusted Publishing — no NPM_TOKEN needed.
# One-time setup on npmjs.com:
#   @reearth/cms-api -> repo reearth/reearth-cms-api,
#   workflow ts-release.yml, environment npm-publish.
# Keep this file named ts-release.yml so that stays valid.
#
# The `npm-publish` environment gate requires a reviewer to approve before
# the publish step runs, preventing accidental releases.

name: Publish @reearth/cms-api

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match ts/package.json)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing + provenance

concurrency:
  group: ts-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted Publishing requires Node >=22.14 and npm >=11.5.1
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org"

      - name: Verify input version matches package.json version
        working-directory: ts
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "package.json version: $PKG_VERSION"
          echo "input version: $INPUT_VERSION"
          if [ "$PKG_VERSION" != "$INPUT_VERSION" ]; then
            echo "::error::Input version ($INPUT_VERSION) does not match ts/package.json version ($PKG_VERSION). Update package.json first."
            exit 1
          fi

      - name: Install dependencies
        working-directory: ts
        run: npm ci

      - name: Check no schema drift
        # Don't publish types that are out of date with schemas/integration.yml.
        working-directory: ts
        run: |
          npm run generate
          git diff --exit-code src/generated/schema.ts

      - name: Test
        # A published version number can't be reused, so don't publish broken code.
        working-directory: ts
        run: npm test

      - name: Activate npm via corepack
        # Make sure npm >=11.5.1 is used for Trusted Publishing
        run: |
          corepack enable npm
          corepack prepare npm@11.5.1 --activate
          npm --version

      - name: Publish to npm (OIDC Trusted Publishing)
        # prepublishOnly runs format:check, typecheck and test; prepack runs build.
        working-directory: ts
        run: npm publish --provenance --access public
